[project]
name = "zerospec"
version = "0.1.0"
description = "Noise spectrum estimation from spectrogram zeros: code for 'Spectrogram Zeros of Colored Noise'"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "h5py>=3.11",
    "gwosc>=0.7",
    "requests>=2.32",
    "tqdm>=4.66",
    "soundfile>=0.14.0",
    "pystoi>=0.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerospec"]
